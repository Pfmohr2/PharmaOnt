services:
  postgres:
    image: postgres:16-alpine
    container_name: ${COMPOSE_PROJECT_NAME:-pharmaops-local}-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pharmaops_local}
      POSTGRES_USER: ${POSTGRES_USER:-pharmaops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pharmaops_local_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pharmaops} -d ${POSTGRES_DB:-pharmaops_local}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - pharmaops

  rdf-store:
    image: stain/jena-fuseki:latest
    container_name: ${COMPOSE_PROJECT_NAME:-pharmaops-local}-fuseki
    restart: unless-stopped
    environment:
      ADMIN_PASSWORD: ${FUSEKI_ADMIN_PASSWORD:-pharmaops_local_password}
      JVM_ARGS: ${FUSEKI_JVM_ARGS:--Xmx1g}
      TDB: "2"
      FUSEKI_DATASET_1: ${FUSEKI_DATASET:-pharmaops}
    ports:
      - "${FUSEKI_PORT:-3030}:3030"
    volumes:
      - fuseki_data:/fuseki
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:3030/\\$/ping || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - pharmaops

networks:
  pharmaops:
    name: ${COMPOSE_PROJECT_NAME:-pharmaops-local}-network

volumes:
  postgres_data:
    name: ${COMPOSE_PROJECT_NAME:-pharmaops-local}-postgres-data
  fuseki_data:
    name: ${COMPOSE_PROJECT_NAME:-pharmaops-local}-fuseki-data
